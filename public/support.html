<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>prsm Support</title>
    <meta
      name="description"
      content="Contact prsm support or share feedback. We read every message and respond as quickly as we can."
    />
    <style>
      :root {
        color-scheme: dark;
        --background: #0f0f0f;
        --surface: #171717;
        --border: #2b2b2b;
        --text-primary: #f0f0f0;
        --text-secondary: #c9c9c9;
        --text-tertiary: #9a9a9a;
        --accent: #6d7d98;
        --radius-lg: 20px;
        --radius-md: 14px;
        --shadow: 0 24px 48px rgba(0, 0, 0, 0.4);
        --font: 'Inter', 'Segoe UI', sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: var(--font);
        background: radial-gradient(circle at 20% 10%, rgba(109, 125, 152, 0.18), transparent 50%),
          linear-gradient(180deg, #0f0f0f, #131313 60%, #0f0f0f 100%);
        color: var(--text-primary);
      }

      header {
        padding: 24px;
        border-bottom: 1px solid var(--border);
        background: rgba(20, 20, 20, 0.9);
        position: sticky;
        top: 0;
        backdrop-filter: blur(12px);
      }

      header a {
        color: inherit;
        text-decoration: none;
        font-weight: 600;
        letter-spacing: 0.02em;
      }

      main {
        max-width: 960px;
        margin: 0 auto;
        padding: 64px 24px 96px;
      }

      h1 {
        font-size: clamp(2rem, 4vw, 3rem);
        margin: 0 0 12px;
      }

      p {
        margin: 0 0 24px;
        color: var(--text-secondary);
        line-height: 1.6;
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 28px;
        box-shadow: var(--shadow);
      }

      form {
        display: grid;
        gap: 16px;
      }

      label {
        font-size: 0.9rem;
        color: var(--text-secondary);
      }

      input,
      select,
      textarea {
        width: 100%;
        padding: 14px 16px;
        border-radius: var(--radius-md);
        border: 1px solid var(--border);
        background: #121212;
        color: var(--text-primary);
        font-size: 1rem;
        font-family: inherit;
      }

      textarea {
        min-height: 140px;
        resize: vertical;
      }

      button {
        border: none;
        border-radius: 999px;
        padding: 14px 22px;
        font-weight: 600;
        font-size: 1rem;
        background: var(--accent);
        color: #f5f6f9;
        cursor: pointer;
      }

      .helper {
        color: var(--text-tertiary);
        font-size: 0.85rem;
      }

      @media (max-width: 640px) {
        main {
          padding: 48px 20px 72px;
        }

        .card {
          padding: 20px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <a href="/">prsm</a>
    </header>
    <main>
      <h1>Support &amp; Feedback</h1>
      <p>
        Tell us what you need help with or share product feedback.
      </p>
      <section class="card" aria-label="Support form">
        <form id="support-form" action="https://hooks.zapier.com/hooks/catch/25891585/ug4musl/" method="post">
          <div>
            <label for="name">Name</label>
            <input id="name" name="name" type="text" placeholder="Your name" required />
          </div>
          <div>
            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="you@example.com" required />
          </div>
          <div>
            <label for="type">Type</label>
            <select id="type" name="type" required>
              <option value="Support request">Support request</option>
              <option value="Product feedback">Product feedback</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div>
            <label for="message">Message</label>
            <textarea id="message" name="message" placeholder="Share the details here." required></textarea>
          </div>
          <input type="hidden" name="timestamp" />
          <button type="submit">Send to prsm</button>
          <div class="helper" id="support-status" role="status"></div>
        </form>
      </section>
    </main>
    <script>
      const form = document.getElementById('support-form');
      const status = document.getElementById('support-status');
      const pad = (value) => value.toString().padStart(2, '0');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        status.textContent = 'Sending...';

        const now = new Date();
        const timestamp = `${pad(now.getMonth() + 1)}/${pad(now.getDate())}/${now.getFullYear()} ${now.getHours()}:${pad(
          now.getMinutes(),
        )}:${pad(now.getSeconds())}`;
        form.querySelector('input[name="timestamp"]').value = timestamp;

        try {
          await fetch(form.action, {
            method: 'POST',
            body: new FormData(form),
            mode: 'no-cors',
          });
          form.reset();
          status.textContent = 'Thanks! Your message has been sent.';
        } catch (error) {
          status.textContent = 'Something went wrong. Please try again.';
        }
      });
    </script>
  </body>
</html>
